
name: Build ETHIO NetX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css script.js www/

      - name: Create Capacitor configuration
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.ethionet.netx',appName:'ETHIO NetX',webDir:'www'},null,2))"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETHIO-NetX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
